server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: dayflow-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/dayflow}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

# Supabase & Application Specific Configurations
supabase:
  url: ${SUPABASE_URL:https://localhost.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:placeholder-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder-service-role-key}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER:https://localhost.supabase.co/auth/v1}

# Application Security & CORS
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method

# Logging
logging:
  level:
    root: INFO
    com.dayflow.hrms: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
