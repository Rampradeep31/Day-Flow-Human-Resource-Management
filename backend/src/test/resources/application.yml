spring:
  datasource:
    url: jdbc:h2:mem:dayflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Test Application Config
app:
  cors:
    allowed-origins: http://localhost:5173

supabase:
  url: https://test.supabase.co
  anon-key: test-anon-key
  service-role-key: test-service-role-key
  jwt:
    issuer: https://test.supabase.co/auth/v1
    secret: dayflow-test-super-secure-jwt-secret-key-32-chars-min
